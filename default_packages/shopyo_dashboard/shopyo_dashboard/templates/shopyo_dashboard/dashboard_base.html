<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - Shopyo</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#6366f1',
                            dark: '#4f46e5'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    {% block pagehead %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen flex flex-col" x-cloak>

    {% include "shopyo_base/nav_base.html" %}

    <!-- Content Area -->
    <main class="flex-1 py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        {% include 'shopyo_base/blocks/flashed_messages.html' %}
        {% block content %}{% endblock %}
    </main>

    <footer class="py-12 text-center border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50">
        <div class="flex flex-col md:flex-row justify-between items-center max-w-7xl mx-auto px-8 gap-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em]">
                {{OUR_APP_NAME}} <span class="mx-2 text-slate-200 dark:text-slate-800">|</span> Modular Ecosystem
            </p>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">
                &copy; {{ current_year }} Shopyo Framework
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
